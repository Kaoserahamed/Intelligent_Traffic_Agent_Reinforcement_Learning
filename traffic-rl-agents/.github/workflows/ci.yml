name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src/
      - name: Ruff (format check)
        run: ruff format --check src/
      - name: Mypy (type check)
        run: mypy src/traffic_rl/

  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          python -m pytest src/traffic_rl/tests/ \
            -v --cov=traffic_rl --cov-report=xml --cov-report=term-missing \
            --structured-report reports/test-report.json
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.xml
            reports/test-report.json

  test-310:
    name: Test (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          python -m pytest src/traffic_rl/tests/ -v --cov=traffic_rl \
            --structured-report reports/test-report-310.json

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r <(pip freeze) || true
      - name: Check for unsafe pickle usage
        run: |
          echo "Checking for unsafe torch.load / pickle.load without weights_only..."
          if grep -rn 'torch.load' src/traffic_rl/ --include="*.py" | grep -v 'weights_only=True'; then
            echo "WARNING: Found torch.load without weights_only=True"
          fi
      - name: Run bandit
        run: |
          pip install bandit
          bandit -r src/traffic_rl/ -ll || true